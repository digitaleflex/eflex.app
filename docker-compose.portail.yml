services:
  portail:
    build:
      context: .
      dockerfile: portail/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    container_name: eflex-portail
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Next standalone se lie à l'IP du conteneur par défaut ; 0.0.0.0 est
      # nécessaire pour que le healthcheck (localhost) et Traefik le joignent.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://portail.eurinhash.com}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - 'traefik.http.routers.portail.rule=Host(`portail.eurinhash.com`)'
      - "traefik.http.routers.portail.entrypoints=websecure"
      - "traefik.http.routers.portail.tls=true"
      - "traefik.http.routers.portail.tls.certresolver=letsencrypt"
      - "traefik.http.services.portail.loadbalancer.server.port=3000"
    networks:
      - proxy
    volumes:
      - eflex_backups:/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true

volumes:
  eflex_backups: