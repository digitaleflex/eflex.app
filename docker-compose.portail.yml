# Domaines : `set -a; . ./config/domains.sh; set +a` avant toute commande,
# ou passer par `bash deploy.sh`. Aucun domaine n'est codé en dur ici.
services:
  portail:
    build:
      context: .
      dockerfile: portail/Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: eflex-portail
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Next standalone se lie à l'IP du conteneur par défaut ; 0.0.0.0 est
      # nécessaire pour que le healthcheck (localhost) et Traefik le joignent.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - DEPLOYMENT_TIMEOUT_MINUTES=${DEPLOYMENT_TIMEOUT_MINUTES:-30}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?sourcer config/domains.sh}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_MESSAGE=${MAINTENANCE_MESSAGE:-}
      - STATUS_ENGINE_URL=${STATUS_ENGINE_URL:-}
      - ENV_ENCRYPTION_KEY=${ENV_ENCRYPTION_KEY:?openssl rand -base64 32}
      - ENV_ENCRYPTION_KEY_PREVIOUS=${ENV_ENCRYPTION_KEY_PREVIOUS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
      - KKIAPAY_PUBLIC_KEY=${KKIAPAY_PUBLIC_KEY:-}
      - KKIAPAY_PRIVATE_KEY=${KKIAPAY_PRIVATE_KEY:-}
      - KKIAPAY_SECRET_KEY=${KKIAPAY_SECRET_KEY:-}
      - KKIAPAY_SANDBOX=${KKIAPAY_SANDBOX:-false}
      - KKIAPAY_WEBHOOK_SECRET=${KKIAPAY_WEBHOOK_SECRET:-}
      - FEDAPAY_SECRET_KEY=${FEDAPAY_SECRET_KEY:-}
      - FEDAPAY_SANDBOX=${FEDAPAY_SANDBOX:-false}
      - FEDAPAY_WEBHOOK_SECRET=${FEDAPAY_WEBHOOK_SECRET:-}
      - INVOICE_COMPANY_NAME=${INVOICE_COMPANY_NAME:-Eflex}
      - INVOICE_COMPANY_ADDRESS=${INVOICE_COMPANY_ADDRESS:-}
      - INVOICE_COMPANY_EMAIL=${INVOICE_COMPANY_EMAIL:-admin@eflex.app}
      - INVOICE_TAX_ID=${INVOICE_TAX_ID:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - 'traefik.http.routers.portail.rule=Host(`${PORTAL_DOMAIN:?sourcer config/domains.sh}`)'
      - "traefik.http.routers.portail.entrypoints=websecure"
      - "traefik.http.routers.portail.tls=true"
      - "traefik.http.routers.portail.tls.certresolver=letsencrypt"
      - "traefik.http.services.portail.loadbalancer.server.port=3000"
    networks:
      - proxy
    volumes:
      - eflex_backups:/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true

volumes:
  eflex_backups: