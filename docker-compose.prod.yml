# ---------------------------------------------------------------------------
# Moteur Eflex — services applicatifs de production (un seul serveur)
# ---------------------------------------------------------------------------
# Services :
#   portail   : API + interface client (Next.js, output standalone)
#   postgres  : base de données principale (users, projets, déploiements)
#   redis     : cache, sessions, file d'attente légère
#   migrate   : migration Prisma one-off (profil "tools", lancée par deploy.sh)
# ---------------------------------------------------------------------------
# Traefik n'est PAS géré par ce fichier : le serveur (local ou VPS) fournit
# déjà un Traefik sur le réseau Docker externe `proxy`, avec le certresolver
# `letsencrypt`. Le portail s'y rattache uniquement via ses labels.
# ---------------------------------------------------------------------------
# Domaines : AUCUN domaine codé en dur. `bash deploy.sh` source
# `config/domains.sh` (source unique) ; pour un appel direct à Compose, faire
# `set -a; . ./config/domains.sh; set +a` au préalable.
# Prérequis :
#   1. cp .env.prod.example .env.prod  (puis adapter les secrets uniquement)
#   2. un Traefik existant sur le réseau `proxy` (docker network inspect proxy)
#   3. bash deploy.sh
# ---------------------------------------------------------------------------

services:
  ###########################################################################
  # PORTAIL — Next.js (API + interface client)
  ###########################################################################
  portail:
    build:
      context: .
      dockerfile: portail/Dockerfile
    container_name: eflex-portail
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Next standalone écoute sur l'IP du conteneur par défaut : on force
      # 0.0.0.0 pour que le healthcheck et Traefik puissent le joindre.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?sourcer config/domains.sh}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - COOLIFY_API_URL=${COOLIFY_API_URL}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN}
      - PORTAL_DOMAIN=${PORTAL_DOMAIN:?sourcer config/domains.sh}
      - PORTAL_URL=${PORTAL_URL:?sourcer config/domains.sh}
      # ─── Statut public et maintenance ─────────────────────────────────────
      # MAINTENANCE_MODE=true → 503 sur tout le site (middleware) + bannière.
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_MESSAGE=${MAINTENANCE_MESSAGE:-}
      # Laisser vide tant que le moteur Axiom n'est pas déployé (sinon "non surveillé").
      - STATUS_ENGINE_URL=${STATUS_ENGINE_URL:-}
      - ENV_ENCRYPTION_KEY=${ENV_ENCRYPTION_KEY:?openssl rand -base64 32}
      - ENV_ENCRYPTION_KEY_PREVIOUS=${ENV_ENCRYPTION_KEY_PREVIOUS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - RESEND_WEBHOOK_SECRET=${RESEND_WEBHOOK_SECRET:-}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.portail.rule=Host(`${PORTAL_DOMAIN:?sourcer config/domains.sh}`)"
      - "traefik.http.routers.portail.entrypoints=websecure"
      - "traefik.http.routers.portail.tls.certresolver=letsencrypt"
      - "traefik.http.services.portail.loadbalancer.server.port=3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - proxy
      - eflex-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ###########################################################################
  # MIGRATE — `prisma migrate deploy` dans le réseau interne (one-off)
  ###########################################################################
  migrate:
    build:
      context: .
      dockerfile: portail/Dockerfile
      target: migrator
    profiles: ["tools"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eflex-internal

  ###########################################################################
  # POSTGRESQL — base de données principale
  ###########################################################################
  postgres:
    image: postgres:16-alpine
    container_name: eflex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - eflex_postgres_data:/var/lib/postgresql/data
    networks:
      - eflex-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ###########################################################################
  # REDIS — cache et sessions
  ###########################################################################
  redis:
    image: redis:7-alpine
    container_name: eflex-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - eflex-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eflex_postgres_data:

networks:
  proxy:
    external: true
  eflex-internal:
    driver: bridge
